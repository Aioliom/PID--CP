<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PID 仿真</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: #f6f7f9;
    color: #111827;
    font-family: ui-sans-serif, system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 36px 28px 44px; }

  .card {
    background: #fff;
    border: 1px solid #e8eaee;
    border-radius: 16px;
    box-shadow: 0 1px 2px rgba(16,24,40,.04);
  }

  /* ---------- 数学模型 ---------- */
  .model { padding: 34px 24px 30px; text-align: center; }
  .eq {
    font-family: "Cambria Math", "Latin Modern Math", "Times New Roman", Georgia, serif;
    font-size: 29px;
    font-style: italic;
    line-height: 1.6;
    color: #0f172a;
    white-space: nowrap;
  }
  .eq sub, .eq sup { font-style: normal; font-size: 60%; }
  .limits {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    vertical-align: -0.4em;
    font-size: 58%;
    font-style: normal;
    line-height: 1.05;
    margin: 0 2px;
  }
  .limits span { display: block; }
  .frac {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    vertical-align: middle;
    font-size: .74em;
    line-height: 1.25;
  }
  .frac .num { border-bottom: 1.3px solid currentColor; padding: 0 .38em .06em; }
  .frac .den { padding: .06em .38em 0; }

  .eq2 {
    margin-top: 12px;
    font-family: "Cambria Math", Georgia, serif;
    font-style: italic;
    font-size: 21px;
    color: #55607a;
  }
  .legend {
    margin-top: 16px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px 26px;
    font-size: 13px;
    color: #8b94a6;
  }
  .legend i {
    font-family: "Cambria Math", Georgia, serif;
    font-size: 15px;
    color: #475569;
    margin-right: 5px;
  }

  /* ---------- 布局 ---------- */
  .panel {
    display: grid;
    grid-template-columns: 232px 1fr;
    gap: 22px;
    margin-top: 22px;
  }

  .controls { padding: 26px 24px; display: flex; flex-direction: column; justify-content: center; gap: 40px; }
  .ctrl .row { display: flex; align-items: baseline; justify-content: space-between; }
  .ctrl label { font-family: "Cambria Math", Georgia, serif; font-size: 17px; color: #374151; }
  .ctrl .val { font-size: 14px; font-weight: 600; color: #2563eb; font-variant-numeric: tabular-nums; }

  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 4px;
    margin: 16px 0 0;
    background: #e6e9ee;
    border-radius: 999px;
    outline: none; cursor: pointer;
    touch-action: pan-y;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 17px; height: 17px; border-radius: 50%;
    background: #fff; border: 2px solid #2563eb;
    box-shadow: 0 1px 3px rgba(16,24,40,.18);
  }
  input[type=range]::-moz-range-thumb {
    width: 13px; height: 13px; border-radius: 50%;
    background: #fff; border: 2px solid #2563eb;
    box-shadow: 0 1px 3px rgba(16,24,40,.18);
  }
  input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 4px rgba(37,99,235,.15); }

  .chart { height: 600px; padding: 12px; min-width: 0; }
  canvas { display: block; width: 100%; height: 100%; }

  @media (max-width: 980px) { .eq { font-size: 23px; } }
  @media (max-width: 760px) {
    .wrap { padding: 22px 14px 26px; }
    .model { padding: 22px 14px; }
    .eq { font-size: 19px; white-space: normal; }
    .eq2 { font-size: 17px; }
    .legend { gap: 6px 16px; font-size: 12px; }
    .panel { grid-template-columns: 1fr; gap: 14px; }
    .chart { height: 360px; }
    .controls { flex-direction: row; flex-wrap: wrap; gap: 18px 26px; padding: 20px; }
    .ctrl { flex: 1 1 130px; }
  }
</style>
</head>
<body>
<main class="wrap">
  <header class="card model">
    <div class="eq">
      u(t) = K<sub>p</sub> e(t) + K<sub>i</sub> ∫<span class="limits"><span>t</span><span>0</span></span> e(τ)dτ + K<sub>d</sub> <span class="frac"><span class="num">de(t)</span><span class="den">dt</span></span>
    </div>
    <div class="eq2">e(t) = r(t) − y(t)</div>
    <div class="legend">
      <span><i>u</i>控制输出 Out</span>
      <span><i>e</i>误差 Err</span>
      <span><i>r</i>目标值</span>
      <span><i>y</i>实际输出</span>
    </div>
  </header>

  <section class="panel">
    <aside class="card controls">
      <div class="ctrl">
        <div class="row"><label>K<sub>p</sub></label><span class="val" id="kpv">4.0</span></div>
        <input type="range" id="kp" min="0" max="200" step="0.1" value="4">
      </div>
      <div class="ctrl">
        <div class="row"><label>K<sub>i</sub></label><span class="val" id="kiv">1.5</span></div>
        <input type="range" id="ki" min="0" max="200" step="0.1" value="1.5">
      </div>
      <div class="ctrl">
        <div class="row"><label>K<sub>d</sub></label><span class="val" id="kdv">0.8</span></div>
        <input type="range" id="kd" min="0" max="200" step="0.1" value="0.8">
      </div>
    </aside>

    <div class="card chart"><canvas id="plot"></canvas></div>
  </section>
</main>

<script>
(() => {
  const canvas = document.getElementById('plot');
  const ctx = canvas.getContext('2d');

  const SP = 1;                        // 固定目标值
  const TSPAN = 12;                    // 横轴 0 ~ 12 s
  const YMIN = -0.05, YMAX = 1.55;     // 纵轴固定
  const STEP = 1 / 400;                // 计算步长

  const P = { kp: 4, ki: 1.5, kd: 0.8 };

  const bind = (id, outId, key) => {
    const el = document.getElementById(id);
    const out = document.getElementById(outId);
    el.addEventListener('input', () => {
      P[key] = parseFloat(el.value);
      out.textContent = P[key].toFixed(1);
      render();
    });
  };
  bind('kp', 'kpv', 'kp');
  bind('ki', 'kiv', 'ki');
  bind('kd', 'kdv', 'kd');

  // 闭环单位阶跃响应：对象 y'' = u - 2y' - y
  function simulate() {
    const pts = [{ t: 0, y: 0 }];
    let y = 0, dy = 0, I = 0, ePrev = SP, t = 0;
    const n = Math.round(TSPAN / STEP);
    for (let i = 0; i < n; i++) {
      const e = SP - y;
      const de = (e - ePrev) / STEP;
      I += e * STEP;
      let u = P.kp * e + P.ki * I + P.kd * de;
      if (u > 50) u = 50; else if (u < -50) u = -50;
      if (P.ki > 1e-6) {
        const lim = 20 / P.ki;
        if (I > lim) I = lim; else if (I < -lim) I = -lim;
      }
      const ddy = u - 2 * dy - y;
      dy += ddy * STEP;
      y += dy * STEP;
      ePrev = e;
      t += STEP;
      pts.push({ t, y });
    }
    return pts;
  }

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = canvas.clientWidth || 1, h = canvas.clientHeight || 1;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  const L = 52, R = 18, T = 16, B = 34;

  function render() {
    const w = canvas.clientWidth || 1, h = canvas.clientHeight || 1;
    ctx.clearRect(0, 0, w, h);

    const x0 = L, x1 = w - R, y1 = h - B, y0 = T;
    const pw = x1 - x0, ph = y1 - y0;
    const X = t => x0 + t / TSPAN * pw;
    const Y = v => y1 - (v - YMIN) / (YMAX - YMIN) * ph;

    ctx.font = '11px ui-sans-serif, system-ui, "Segoe UI", sans-serif';
    ctx.lineWidth = 1;
    ctx.textBaseline = 'middle';

    // 横向网格 + Y 刻度
    ctx.textAlign = 'right';
    for (const v of [0, 0.5, 1.0, 1.5]) {
      const yy = Math.round(Y(v)) + 0.5;
      ctx.strokeStyle = '#eef1f5';
      ctx.beginPath(); ctx.moveTo(x0, yy); ctx.lineTo(x1, yy); ctx.stroke();
      ctx.fillStyle = '#98a2b3';
      ctx.fillText(v.toFixed(1), x0 - 10, yy);
    }

    // 纵向网格 + 时间刻度
    ctx.textAlign = 'center';
    for (let s = 0; s <= TSPAN; s += 2) {
      const xx = Math.round(X(s)) + 0.5;
      ctx.strokeStyle = '#eef1f5';
      ctx.beginPath(); ctx.moveTo(xx, y0); ctx.lineTo(xx, y1); ctx.stroke();
      ctx.fillStyle = '#98a2b3';
      ctx.fillText(s + 's', xx, y1 + 17);
    }

    // 坐标轴
    ctx.strokeStyle = '#dfe4ec';
    ctx.beginPath();
    ctx.moveTo(x0 + 0.5, y0); ctx.lineTo(x0 + 0.5, y1 + 0.5); ctx.lineTo(x1, y1 + 0.5);
    ctx.stroke();

    // 目标值参考线
    ctx.strokeStyle = '#c9d1de';
    ctx.setLineDash([6, 6]);
    ctx.beginPath();
    ctx.moveTo(x0, Y(SP)); ctx.lineTo(x1, Y(SP));
    ctx.stroke();
    ctx.setLineDash([]);

    // 输出响应曲线
    const pts = simulate();
    ctx.save();
    ctx.beginPath();
    ctx.rect(x0, y0, pw, ph);
    ctx.clip();
    ctx.strokeStyle = '#2563eb';
    ctx.lineWidth = 2.5;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.beginPath();
    for (let i = 0; i < pts.length; i++) {
      const px = X(pts[i].t), py = Y(pts[i].y);
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.stroke();
    ctx.restore();
  }

  resize();
  render();
  new ResizeObserver(() => { resize(); render(); }).observe(canvas);
})();
</script>
</body>
</html>
